<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shaikh E-Commerce</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header>
  <div class="wrap">

    <div class="brand">
      <div class="logo">SE</div>

      <div>
        <h2>Shaikh E-Commerce</h2>
        <p>Responsive E-Commerce Website</p>
      </div>
    </div>

    <div class="search">
      <input id="q" type="search" placeholder="Search products..." />
      <button id="searchBtn">Search</button>
    </div>

  </div>
</header>

<main>

  <!-- PRODUCTS -->
  <section>

    <div class="hero">
      <div>
        <h1>Modern Shopping Experience</h1>
        <p>Responsive E-Commerce Website with Admin & Buyer Login</p>
      </div>
    </div>

    <div class="top-controls">

      <p>Products (<span id="count">0</span>)</p>

      <div>
        <button id="sortPrice">Sort by Price</button>
        <button id="clearProducts">Reset Products</button>
      </div>

    </div>

    <div id="products" class="grid"></div>

  </section>

  <!-- SIDEBAR -->
  <aside>

    <!-- BUYER LOGIN -->
    <div class="panel">

      <h3>Buyer Login</h3>

      <div id="buyerLoginBox">

        <input type="text" id="buyerUsername" placeholder="Username" />
        <input type="password" id="buyerPassword" placeholder="Password" />

        <button id="buyerLoginBtn">Login</button>

      </div>

      <div id="buyerWelcome" style="display:none;">

        <p>Welcome Buyer</p>

        <button id="buyerLogoutBtn">Logout</button>

      </div>

    </div>

    <div class="space"></div>

    <!-- CART -->
    <div class="panel">

      <h3>Quick Cart</h3>

      <p>Items: <span id="cartCount">0</span></p>

      <div id="cartList"></div>

      <div class="cart-buttons">
        <button id="checkoutBtn">Checkout</button>
        <button id="clearCart">Clear</button>
      </div>

    </div>

    <div class="space"></div>

    <!-- ADMIN -->
    <div class="panel">

      <h3>Admin Portal</h3>

      <div id="adminLoginBox">

        <input type="text" id="adminUsername" placeholder="Admin Username" />
        <input type="password" id="adminPassword" placeholder="Admin Password" />

        <button id="adminLoginBtn">Login</button>

      </div>

      <div id="adminPanel" style="display:none;">

        <h4>Add Product</h4>

        <input type="text" id="pName" placeholder="Product Name" />

        <input type="number" id="pPrice" placeholder="Price" />

        <textarea id="pDesc" placeholder="Description"></textarea>

        <input type="file" id="pImage" accept="image/*" />

        <button id="addProduct">Add Product</button>

        <button id="adminLogoutBtn">Logout</button>

      </div>

    </div>

  </aside>

</main>

<!-- PAYMENT MODAL -->
<div id="modal" class="modal">

  <div class="modal-box">

    <h3>Complete Purchase</h3>

    <div id="modalBody"></div>

    <div class="modal-buttons">
      <button id="payNow">Pay</button>
      <button id="closeModal">Close</button>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
